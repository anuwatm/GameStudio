<!doctype html>
<meta charset="utf-8">
<title>StoryFlow Worker benchmark</title>
<pre id="status">Running…</pre>
<script type="module">
const worker = new Worker("./worker.mjs", { type: "module" });
const pending = new Map();
worker.onmessage = ({data}) => {
  const handler = pending.get(data.requestId);
  if (handler) { pending.delete(data.requestId); handler(data); }
};
async function request(message) {
  return new Promise((resolve, reject) => {
    const timeout = setTimeout(() => reject(new Error("Worker timeout")), 30000);
    pending.set(message.requestId, data => { clearTimeout(timeout); resolve(data); });
    worker.postMessage(message);
  });
}
try {
  const messages = await (await fetch("./messages.json")).json();
  const actual = [];
  for (const message of messages) actual.push(await request(message));
  const samples = [];
  const project = await (await fetch("./baseline.json")).json();
  // Warm up the same 2,000-node fixture once before recording.
  for (let repeat = -1; repeat < 5; repeat++) {
    const times = {};
    for (const [name, kind, payload] of [
      ["openProject","command",{project}],
      ["validate","query",{}],
      ["applyEdit","command",{patch:[{op:"replace",path:"/name",value:"Baseline 2000"}]}],
    ]) {
      const start = performance.now();
      const result = await request({contractVersion:1,requestId:`bench-${repeat}-${name}`,kind,name,payload});
      if (result.kind === "error") throw new Error(JSON.stringify(result));
      times[name] = performance.now()-start;
    }
    if (repeat >= 0) samples.push(times);
  }
  const report = {actual,samples,userAgent:navigator.userAgent,hardwareConcurrency:navigator.hardwareConcurrency};
  document.querySelector("#status").textContent=JSON.stringify(report,null,2);
  await fetch("/result",{method:"POST",body:JSON.stringify(report)});
} catch(error) {
  document.querySelector("#status").textContent=String(error);
  await fetch("/result",{method:"POST",body:JSON.stringify({error:String(error)})});
} finally { worker.terminate(); }
</script>
