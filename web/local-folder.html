<!doctype html>
<meta charset="utf-8">
<title>StoryFlow · Local Folder proof</title>
<style>body{font:17px system-ui;max-width:1000px;margin:40px auto;padding:20px;background:#131922;color:#f2f5f7}button{padding:14px 22px;background:#58d4b4;border:0;border-radius:6px;font:inherit;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202938;padding:20px}p{line-height:1.6}</style>
<h1>StoryFlow · Local Folder proof</h1>
<p>เลือกโฟลเดอร์ทดสอบ จะสร้างโฟลเดอร์ case แยกสำหรับตรวจ Export, Recovery และการใช้สื่อเดิม</p>
<button id="open">เลือกโฟลเดอร์ทดสอบและตรวจทั้งหมด</button>
<pre id="status">พร้อมทดสอบ Local Folder</pre>
<script type="module">
import {tests} from "./local-folder-test.mjs";
const status=document.querySelector("#status");
const bundle=await (await fetch("./bundle.json")).json();
async function run(root,mode) {
  status.textContent="กำลังทดสอบ "+mode;
  try {
    const result=await tests(root,bundle);
    result.mode=mode;
    status.textContent=JSON.stringify(result,null,2);
    await fetch("/result",{method:"POST",body:JSON.stringify(result)});
  }catch(error){
    const result={mode,error:String(error),stack:error.stack};
    status.textContent=JSON.stringify(result,null,2);
    await fetch("/result",{method:"POST",body:JSON.stringify(result)});
  }
}
document.querySelector("#open").onclick=async()=>{
  try {await run(await showDirectoryPicker({mode:"readwrite"}),"native-folder");}
  catch(error){status.textContent=String(error);}
};
if(new URL(location.href).searchParams.has("opfs")){
  const root=await navigator.storage.getDirectory();
  await run(await root.getDirectoryHandle("storyflow-"+crypto.randomUUID(),{create:true}),"opfs");
}
</script>
