<!doctype html><html lang="th"><meta charset="utf-8"><title>StoryFlow P8 · native-folder</title><style>body{font:16px system-ui;background:#131922;color:#f2f5f7;margin:24px}button{padding:12px;font:inherit}iframe{width:100%;height:820px;border:1px solid #526174;margin-top:16px}pre{white-space:pre-wrap}p{max-width:80ch}</style><h1>P8 · native-folder จริง</h1><p>เลือกเฉพาะโฟลเดอร์ทดสอบด้านล่าง วัด UI Apply → Core/IDB → Save → Export → native manifest commit และ UI แจ้งสำเร็จ Warm-up 1 + วัด 5 รอบ ไม่ใช้ OPFS หรือ Node adapter</p><pre id="folder"></pre><button id="start" disabled>เลือกโฟลเดอร์จริงและเริ่ม P8</button><p id="status">กำลังเตรียม…</p><pre id="result"></pre><iframe id="studio" src="/studio/dist/"></iframe><script type="module">
const $=s=>document.querySelector(s),frame=$('#studio'),config=await fetch('/native-p8-config').then(r=>r.json());$('#folder').textContent=config.folder;const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument;
async function until(test){const start=performance.now();while(performance.now()-start<20000){const v=test();if(v)return v;await pause(10);}throw Error('UI wait timeout: '+String(test));}
async function ready(){await pause(35);await until(()=>doc()?.querySelector('.session-status')?.textContent==='Core พร้อมใช้งาน');const e=doc().querySelector('.error');if(e)throw Error(e.textContent);}
async function button(text){const b=await until(()=>Array.from(doc().querySelectorAll('button')).find(b=>b.textContent===text&&!b.disabled));b.click();await ready();}
function input(label,value,select=false){const e=Array.from(doc().querySelectorAll(select?'select':'input,textarea')).find(e=>e.getAttribute('aria-label')===label||e.closest('label')?.textContent.trim()===label);if(!e)throw Error('Missing field '+label);e.focus();Object.getOwnPropertyDescriptor(select?frame.contentWindow.HTMLSelectElement.prototype:e.tagName==='TEXTAREA'?frame.contentWindow.HTMLTextAreaElement.prototype:frame.contentWindow.HTMLInputElement.prototype,'value').set.call(e,value);e.dispatchEvent(new frame.contentWindow.Event(select?'change':'input',{bubbles:true}));}
async function hash(bytes){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(v=>v.toString(16).padStart(2,'0')).join('');}
await until(()=>doc()?.querySelector('.session-status')?.textContent==='Core พร้อมใช้งาน');$('#start').disabled=false;$('#status').textContent='พร้อม · ให้เจ้าของเลือกและอนุญาตโฟลเดอร์เอง';
$('#start').onclick=async()=>{const report={passed:false,status:'selecting',samples:[],folder:config.folder,fixtureHash:config.fixtureHash,nodeCount:9,browser:navigator.userAgent,hardwareConcurrency:navigator.hardwareConcurrency,method:'real native showDirectoryPicker and production UI iframe; Apply→Core/IDB→manual Save→Export→native commit→paint success; warmup1+5; no OPFS/Node adapter'};
try{const root=await window.showDirectoryPicker({mode:'readwrite'});if(root.name!==config.folderName)throw Error('เลือกโฟลเดอร์ไม่ตรง: '+root.name);const permission=await root.queryPermission({mode:'readwrite'});if(permission!=='granted')throw Error('Native permission '+permission);const initial=await(await root.getFileHandle('project.storyflow.json')).getFile();if(await hash(await initial.arrayBuffer())!==config.initialFileHash)throw Error('ไฟล์ไม่ตรงกับชุดทดสอบ');const project=JSON.parse(await initial.text());$('#start').disabled=true;report.nativeHandle={name:root.name,kind:root.kind,permission};report.uiBuild=doc().querySelector('script[type="module"]')?.getAttribute('src');frame.contentWindow.showDirectoryPicker=async()=>root;await button('เปิดโฟลเดอร์โปรเจกต์');await until(()=>doc().querySelector('.canvas'));
async function bytes(path){const parts=path.split('/'),name=parts.pop();let d=root;for(const p of parts)d=await d.getDirectoryHandle(p);return new Uint8Array(await(await d.getFileHandle(name)).getFile().then(f=>f.arrayBuffer()));}
for(let round=0;round<6;round++){$('#status').textContent='กำลังวัด P8 รอบ '+round+' / 5 (0 warm-up)';await button('Story Graph');input('เลือกโหนด',project.nodes[0].id,true);await until(()=>doc().querySelector('.node-inspector>code')?.textContent===project.nodes[0].id);input('บทพูด 1','P8 visible native edit '+round+' ไทย');const start=performance.now();await button('ใช้การแก้ไขโหนด');const save=Array.from(doc().querySelectorAll('button')).find(b=>b.textContent==='บันทึกโปรเจกต์');if(save&&!save.disabled)await button('บันทึกโปรเจกต์');await button('Export');await button('ตรวจและเตรียมส่งออก');await button('ส่งออกไปยังโฟลเดอร์นี้');await until(()=>doc().querySelector('.export-result h2')?.textContent==='ส่งออกสำเร็จ');await new Promise(r=>frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(r)));const ms=performance.now()-start,savedProject=JSON.parse(new TextDecoder().decode(await bytes('project.storyflow.json')));if(savedProject.nodes.find(n=>n.id===project.nodes[0].id).lines[0].text!=='P8 visible native edit '+round+' ไทย')throw Error('UI edit did not reach saved Core snapshot');const manifest=JSON.parse(new TextDecoder().decode(await bytes('game/storyflow_generated/sf_manifest.json'))),hashes={};for(const [path,expected]of Object.entries(manifest.files)){const actual=await hash(await bytes(path));hashes[path]={expected,actual,equal:expected===actual};}if(!Object.values(hashes).every(h=>h.equal))throw Error('Manifest hash mismatch');report.samples.push({round,warmup:round===0,ms,hashes,savedSceneText:savedProject.nodes.find(n=>n.id===project.nodes[0].id).lines[0].text});$('#result').textContent=JSON.stringify(report.samples,null,2);}
const values=report.samples.slice(1).map(s=>s.ms).sort((a,b)=>a-b);report.median=values[2];report.max=values.at(-1);report.limit=5000;report.passed=report.median<=5000;report.status='complete';$('#status').textContent=(report.passed?'P8 ผ่าน':'P8 ไม่ผ่าน')+' · median '+report.median.toFixed(1)+' ms';}
catch(e){report.status='failed';report.error=String(e);$('#status').textContent=String(e);$('#start').disabled=false;}
$('#result').textContent=JSON.stringify(report,null,2);await fetch('/native-p8-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});};
</script></html>
